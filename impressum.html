<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Impressum und rechtliche Hinweise gemäß § 5 DDG.">
  <title>Impressum</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      --bg-mint-top: #b8ebd0;
      --bg-mint-bottom: #c4efd6;
      --surface-cream: #fdfcf7;
      --surface-pill: #f4f3ec;
      --border-soft: rgba(19, 28, 49, 0.08);
      --border-pill: #e4e2d6;
      --text-heading: #131c31;
      --text-body: #475569;
      --text-muted: #64748b;

      --emerald: #0a9b6c;
      --emerald-hover: #07855c;
      --emerald-soft: #dff7ec;
      --emerald-soft-border: #b8ead3;
      --emerald-soft-text: #087a52;

      --slate-sidebar-grad: linear-gradient(160deg, #8ba2b2 0%, #758c9c 100%);
      --shadow-card: 0 6px 22px rgba(19, 28, 49, 0.055), 0 1px 3px rgba(19, 28, 49, 0.03);
      --shadow-emerald: 0 4px 12px rgba(10, 155, 108, 0.26);
    }

    [data-theme="dark"] {
      --bg-mint-top: #0f172a;
      --bg-mint-bottom: #131c31;
      --surface-cream: #182338;
      --surface-pill: #212e47;
      --border-soft: rgba(255, 255, 255, 0.08);
      --border-pill: rgba(255, 255, 255, 0.12);
      --text-heading: #f1f5f9;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;

      --emerald-soft: rgba(16, 185, 129, 0.16);
      --emerald-soft-border: rgba(16, 185, 129, 0.3);
      --emerald-soft-text: #34d399;

      --slate-sidebar-grad: linear-gradient(160deg, #3b4b63 0%, #2d3b50 100%);
      --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    #themeIconMoon { display: none; }
    [data-theme="dark"] #themeIconSun { display: none; }
    [data-theme="dark"] #themeIconMoon { display: block; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-mint-top) 0%, var(--bg-mint-bottom) 100%);
      color: var(--text-heading);
      font-family: "Inter", "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 28px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container { width: 100%; max-width: 1020px; display: flex; flex-direction: column; gap: 18px; }

    .top-bar {
      background-color: var(--surface-cream);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 20px 26px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .top-bar-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      background-color: var(--emerald-soft);
      border: 1px solid var(--emerald-soft-border);
      color: var(--emerald-soft-text);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      line-height: 1.2;
    }

    .top-bar h1 { font-size: clamp(1.45rem, 2.5vw, 1.75rem); font-weight: 800; letter-spacing: -0.025em; color: var(--text-heading); line-height: 1.2; }
    .top-bar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .status-pill {
      background-color: var(--surface-pill);
      border: 1px solid var(--border-pill);
      color: var(--text-heading);
      font-size: 0.84rem;
      font-weight: 600;
      min-height: 38px;
      padding: 7px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .dot-green { width: 8px; height: 8px; border-radius: 50%; background-color: #10b981; flex-shrink: 0; }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background-color: var(--surface-pill);
      border: 1px solid var(--border-pill);
      color: var(--text-heading);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .theme-btn:hover { transform: translateY(-1px); border-color: var(--emerald); }
    .theme-btn:focus-visible, .btn-pill:focus-visible { outline: 2px solid var(--emerald); outline-offset: 2px; }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      line-height: 1.25;
    }

    .btn-pill:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn-emerald { background-color: var(--emerald); box-shadow: var(--shadow-emerald); }

    .disclaimer-box {
      background-color: var(--surface-cream);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: grid;
      grid-template-columns: 245px 1fr;
    }

    .disclaimer-sidebar {
      background: var(--slate-sidebar-grad);
      color: #ffffff;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .sidebar-head { display: flex; align-items: center; gap: 12px; }

    .sidebar-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-eyebrow { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.84); line-height: 1.2; margin-bottom: 2px; }
    .disclaimer-sidebar h3 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.015em; color: #ffffff; line-height: 1.2; }
    .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.24); width: 100%; }
    .sidebar-tag { font-size: 0.82rem; font-weight: 700; color: rgba(255, 255, 255, 0.95); line-height: 1.3; }
    .disclaimer-body { padding: 24px 28px; display: flex; align-items: center; }
    .disclaimer-body p { color: var(--text-body); font-size: 0.93rem; line-height: 1.65; }

    @media (max-width: 760px) {
      .disclaimer-box { grid-template-columns: 1fr; }
      .disclaimer-sidebar { padding: 18px 22px; }
      .disclaimer-body { padding: 20px 22px; }
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px 28px; }
      .top-bar { padding: 18px 20px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="eyebrow-pill">Rechtliche Angaben</span>
        <h1>Impressum</h1>
      </div>
      <div class="top-bar-actions">
        <a href="./" class="btn-pill btn-emerald">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Zurück zur App</span>
        </a>
        <span class="status-pill">
          <span class="dot-green" aria-hidden="true"></span>
          Private Plattform
        </span>
        <button type="button" class="theme-btn" id="themeToggle" aria-label="Farbschema wechseln" title="Farbschema wechseln">
          <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <footer class="disclaimer-box">
      <div class="disclaimer-sidebar">
        <div class="sidebar-head">
          <span class="sidebar-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </span>
          <div>
            <div class="sidebar-eyebrow">Hinweis</div>
            <h3>Disclaimer</h3>
          </div>
        </div>
        <div class="sidebar-divider"></div>
        <span class="sidebar-tag">Unabhängiges Fan-Projekt</span>
      </div>
      <div class="disclaimer-body">
        <p>
          This website is an independent platform and is not associated with, validated, backed, or sponsored by Nintendo, Creatures, Game Freak, The Pokémon Company, Scopely, or Niantic.
        </p>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const themeBtn = document.getElementById("themeToggle");

      themeBtn.addEventListener("click", () => {
        const isDark = root.getAttribute("data-theme") === "dark";
        root.setAttribute("data-theme", isDark ? "light" : "dark");
      });
    })();
  </script>

</body>
</html>
